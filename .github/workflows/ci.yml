name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    install-dependencies:
        name: install dependencies
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
        
            - uses: actions/setup-python@v5
              with:
                  python-version: 3.12
                  cache: "pip"
                  cache-dependencies-path: project.toml

            - name: install dependencies
              run: |
                python -m pip install -e ".[dev]"


    linters:
        name: run linters
        runs-on: ubuntu-latest

        needs: [install-dependencies]

        steps:
          - uses: actions/checkout@v4
        
          - uses: actions/setup-python@v5
            with:
                python-version: 3.12
                cache: "pip"
                cache-dependencies-path: project.toml

          - run: |
              python -m pip install -e ".[dev]"

          - name: Check formatting
            run: |
              ruff check .
              ruff format --check .

    build:
        name: build docker image
        runs-on: ubuntu-latest

        needs: [install-dependencies, linters]

        steps:
          - uses: actions/checkout@v4
          
          - name: Build docker image
            run: |
              docker build -t my-cli:latest .
