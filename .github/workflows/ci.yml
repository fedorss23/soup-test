name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]

  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - run: |
          python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install project
        run: python -m pip install --no-deps -e .

      - name: Check formatting
        run: |
          ruff check .
          ruff format --check .

  tests:
    name: Run tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    needs: [linters]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install project
        run: python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build and verify
    runs-on: ubuntu-latest

    needs: [linters, tests]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Clean old artifacts
        run: rm -rf dist/ build/ *.egg-info

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Create clean virtual environment
        run: python -m venv .venv

      - name: Install wheel
        run: .venv/bin/python -m pip install dist/*.whl

      - name: Verify CLI
        run: |
          .venv/bin/csv-inspector --help
          touch users.csv
          echo "name,age\nfedor,13" > users.csv
          .venv/bin/csv-inspector info users.csv

      - name: Verify sdist
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-sdist/bin/csv-inspector --help

      - name: Verify versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION=$(
              .venv/bin/python -c \
              "from importlib.metadata import version; print(version('csv-inspector-12'))"
          )

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version: $TAG_VERSION"

          test "$PACKAGE_VERSION" = "$TAG_VERSION"

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    environment:
      name: testpypi
      url: https://test.pypi.org/p/csv-inspector-12/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
