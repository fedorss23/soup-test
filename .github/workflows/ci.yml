name: CI


on:
  push:
    branches: [master]
  pull_request:
    branches: [master]


jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: "pip"
          cache-dependency-path: pyproject.toml


      - run: |
          python -m pip install -e ".[dev]"


      - name: Check formatting
        run: |
          ruff check .
          ruff format --check .


  test:
    name: Run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}


    needs: [linters]


    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: "pip"
          cache-dependency-path: pyproject.toml


      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          pytest




  build:
    name: Build
    runs-on: ubuntu-latest


    needs: [linters, test]


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: "pip"
          cache-dependency-path: pyproject.toml


      - name: Build whl
        run: |
          python -m pip install -e ".[dev]"
          python -m build --wheel


  image:
    name: Build docker image
    runs-on: ubuntu-latest


    needs: [linters, test, build]


    steps:
      - uses: actions/checkout@v4


      - name: build docker image
        run: |
          docker build -t my-cli:latest .


