[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-inspector"
version = "0.2.0"
description = "A simple CLI tool for inspecting CSV files"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv-inspector = "csv_inspector.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
    "build>=1.2,<2.0",
]